name: ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: yysls_map_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/yysls_map_test
      RUN_DB_TESTS: "1"
      WEB_ORIGIN: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
      SESSION_SECRET: ci-session-secret-at-least-32-characters
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD_HASH: $argon2id$v=19$m=65536,t=3,p=4$Op34vwy8RoT/3xsXipNpZg$Nxm3mLCqxHC6u5mLA+6zXd73kbgl6YiqNqtCDoXfyIc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: npm ci
      - run: uv sync --project apps/api --frozen
      - run: npm run import:content:validate --workspace @yysls/api
      - run: uv run --project apps/api alembic upgrade head
      - run: npm run verify
      - run: npm run test:api:db
      - run: uv run --project apps/api python -m app.seed
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
