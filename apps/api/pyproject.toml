[project]
name = "yysls-map-api"
version = "0.1.0"
description = "API for the YYSLS story relationship graph"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "alembic>=1.18.4,<2",
  "argon2-cffi>=25.1.0,<26",
  "fastapi[standard]>=0.136.3,<0.137",
  "httpx>=0.28.1,<0.29",
  "psycopg[binary]>=3.2.10,<4",
  "pydantic-settings>=2.14.2,<3",
  "pyjwt>=2.10.1,<3",
  "sqlalchemy>=2.0.46,<2.1",
  "starlette>=1.3.1,<1.4",
]

[dependency-groups]
dev = [
  "mypy>=1.18.2,<2",
  "pytest>=9.0.3,<10",
  "pytest-cov>=7.0.0,<8",
  "pytest-asyncio>=1.2.0,<2",
  "ruff>=0.14.0,<0.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=app --cov-report=term-missing"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
