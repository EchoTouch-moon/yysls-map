services:
  db:
    image: postgres:17
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: yysls_map
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - yysls-pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d yysls_map"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  yysls-pgdata:
